name: CI

# Gate for all PRs to the live branch (`dev`): merges are rejected unless
# every lint, build, docgen and test (including all integration tests)
# passes 100%, and unless the merge carries a version change (releases on
# crates.io cannot be overwritten in place, so every merge to the live
# branch must be accompanied by a new tagged version).

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  version-bump:
    name: Version Change Required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare version with live branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base=origin/dev
          else
            base=HEAD~1
          fi
          cur=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          prev=$(git show "$base:Cargo.toml" 2>/dev/null | grep -m1 '^version' | sed 's/.*"\(.*\)".*/\1/')
          if [ "$cur" = "$prev" ]; then
            echo "::error::Cargo.toml version ($cur) must change on every merge to the live branch (crates.io cannot overwrite an existing version)."
            exit 1
          fi
          echo "Version bumped: $prev -> $cur"

  gate:
    name: Lint / Build / Doc / Tests
    runs-on: ubuntu-latest
    needs: version-bump
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Fetch upstream Go source (pinned)
        run: |
          git clone --quiet https://github.com/charmbracelet/ultraviolet.git upstream-go
          cd upstream-go && git checkout --quiet f5a850f9c2b7ed4def3807fe12d0b5e76d345bdc
      - name: Fetch sibling charming-colorprofile (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/charming-colorprofile
          path: siblings/charming-colorprofile
          ref: dev
      - name: Fetch sibling charming-x-ansi (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/charming-x-ansi
          path: siblings/charming-x-ansi
          ref: dev
      - name: Fetch sibling charming-testkit (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/charming-testkit
          path: siblings/charming-testkit
          ref: dev
      - name: Fetch sibling charming-lipgloss (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/charming-lipgloss
          path: siblings/charming-lipgloss
          ref: dev
      - name: Place sibling crates
        run: |
          mkdir -p ../siblings && true
          mv siblings/charming-colorprofile ../charming-colorprofile
          mv siblings/charming-x-ansi ../charming-x-ansi
          mv siblings/charming-testkit ../charming-testkit
          mv siblings/charming-lipgloss ../charming-lipgloss
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --all-targets
      - name: Docgen
        run: cargo doc --no-deps
      - name: Test (all targets, all integration tests)
        run: cargo test --all-targets
      - name: e2e_examples
        run: ./scripts/e2e_examples.sh
      - name: verify_examples
        run: ./scripts/verify_examples.sh

      - name: verify_mapping
        run: ./scripts/verify_mapping.sh
