name: CI

# Gate for all PRs to the live branch (`dev`): merges are rejected unless
# every lint, build, docgen and test (including all integration tests)
# passes 100%, and unless the merge carries a version change (releases on
# crates.io cannot be overwritten in place, so every merge to the live
# branch must be accompanied by a new tagged version).

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  version-bump:
    name: Version Change Required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify version matches upstream
        run: scripts/verify_upstream_version.sh
  gate:
    name: Lint / Build / Doc / Tests
    runs-on: ubuntu-latest
    needs: version-bump
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
      - name: Configure shared Cargo cache
        run: |
          # The runner image pre-sets CARGO_HOME=$HOME/.cargo; drop the
          # ambient value so the shared-cache defaults apply (the resolver
          # rejects it as an uncontained override otherwise).
          unset CARGO_HOME
          . scripts/cargo-env.sh
          configure_shared_cargo_cache_environment
          {
            echo "CARGO_SHARED_CACHE_DIRECTORY=$CARGO_SHARED_CACHE_DIRECTORY"
            echo "CARGO_HOME=$CARGO_HOME"
            echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR"
            echo "CARGO_BUILD_BUILD_DIR=$CARGO_BUILD_BUILD_DIR"
            echo "CARGO_INSTALL_ROOT=$CARGO_INSTALL_ROOT"
          } >> "$GITHUB_ENV"
      - name: Test shared Cargo cache env
        run: scripts/test-cargo-env.sh
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: 'stable'
      - name: Fetch upstream Go source (pinned)
        run: |
          git clone --quiet --no-tags https://github.com/charmbracelet/ultraviolet.git upstream-go
          cd upstream-go
          git checkout --quiet f5a850f9c2b7ed4def3807fe12d0b5e76d345bdc
      - name: Fetch sibling rusty-bubbletea (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: coderbants/rusty-bubbletea
          path: siblings/rusty-bubbletea
          ref: df1c3b83ae4fe61b57de8194b487732db342468e
          persist-credentials: false
      - name: Fetch sibling rusty-bubbles (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: coderbants/rusty-bubbles
          path: siblings/rusty-bubbles
          ref: 2a88f46cb8179388adb1951adb0f4fdbdcd633c0
          persist-credentials: false
      - name: Fetch sibling rusty-colorprofile (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: coderbants/rusty-colorprofile
          path: siblings/rusty-colorprofile
          ref: 2d505e7821f72f133c17d6cc7afd314e03eddb66
          persist-credentials: false
      - name: Fetch sibling rusty-lipgloss (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: coderbants/rusty-lipgloss
          path: siblings/rusty-lipgloss
          ref: 685b25da2af226b6ab2b9ce70f149eb9e4fb54ee
          persist-credentials: false
      - name: Fetch sibling rusty-testkit (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: coderbants/rusty-testkit
          path: siblings/rusty-testkit
          ref: 163cf16399662da7bf2b17fb6637b466c6402fb2
          persist-credentials: false
      - name: Fetch sibling rusty-x-ansi (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: coderbants/rusty-x-ansi
          path: siblings/rusty-x-ansi
          ref: 971128e8566ad37991cd9cc50ff4f4c8a4b09c29
          persist-credentials: false
      - name: Place sibling crates
        run: |
          mkdir -p ../siblings && true
          mv siblings/rusty-bubbletea ../rusty-bubbletea
          mv siblings/rusty-bubbles ../rusty-bubbles
          mv siblings/rusty-colorprofile ../rusty-colorprofile
          mv siblings/rusty-lipgloss ../rusty-lipgloss
          mv siblings/rusty-testkit ../rusty-testkit
          mv siblings/rusty-x-ansi ../rusty-x-ansi
      - name: Verify downstream dependency source identity
        run: scripts/test-dependency-sources.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --all-targets
      - name: Docgen
        run: cargo doc --no-deps
      - name: Test (all targets, all integration tests)
        run: cargo test --all-targets -- --test-threads=1
      - name: verify_examples
        run: ./scripts/verify_examples.sh

      - name: verify_mapping
        run: ./scripts/verify_mapping.sh
      - name: test_release_guards
        run: ./scripts/test-release-guards.sh
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
      - name: Configure shared Cargo cache
        run: |
          # The runner image pre-sets CARGO_HOME=$HOME/.cargo; drop the
          # ambient value so the shared-cache defaults apply.
          unset CARGO_HOME
          . scripts/cargo-env.sh
          configure_shared_cargo_cache_environment
          {
            echo "CARGO_SHARED_CACHE_DIRECTORY=$CARGO_SHARED_CACHE_DIRECTORY"
            echo "CARGO_HOME=$CARGO_HOME"
            echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR"
            echo "CARGO_BUILD_BUILD_DIR=$CARGO_BUILD_BUILD_DIR"
            echo "CARGO_INSTALL_ROOT=$CARGO_INSTALL_ROOT"
          } >> "$GITHUB_ENV"
      - name: Fetch sibling rusty-bubbletea (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: coderbants/rusty-bubbletea
          path: siblings/rusty-bubbletea
          ref: df1c3b83ae4fe61b57de8194b487732db342468e
          persist-credentials: false
      - name: Fetch sibling rusty-bubbles (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: coderbants/rusty-bubbles
          path: siblings/rusty-bubbles
          ref: 2a88f46cb8179388adb1951adb0f4fdbdcd633c0
          persist-credentials: false
      - name: Fetch sibling rusty-colorprofile (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: coderbants/rusty-colorprofile
          path: siblings/rusty-colorprofile
          ref: 2d505e7821f72f133c17d6cc7afd314e03eddb66
          persist-credentials: false
      - name: Fetch sibling rusty-lipgloss (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: coderbants/rusty-lipgloss
          path: siblings/rusty-lipgloss
          ref: 685b25da2af226b6ab2b9ce70f149eb9e4fb54ee
          persist-credentials: false
      - name: Fetch sibling rusty-testkit (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: coderbants/rusty-testkit
          path: siblings/rusty-testkit
          ref: 163cf16399662da7bf2b17fb6637b466c6402fb2
          persist-credentials: false
      - name: Fetch sibling rusty-x-ansi (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: coderbants/rusty-x-ansi
          path: siblings/rusty-x-ansi
          ref: 971128e8566ad37991cd9cc50ff4f4c8a4b09c29
          persist-credentials: false
      - name: Place sibling crates
        run: |
          mkdir -p ../siblings && true
          mv siblings/rusty-bubbletea ../rusty-bubbletea
          mv siblings/rusty-bubbles ../rusty-bubbles
          mv siblings/rusty-colorprofile ../rusty-colorprofile
          mv siblings/rusty-lipgloss ../rusty-lipgloss
          mv siblings/rusty-testkit ../rusty-testkit
          mv siblings/rusty-x-ansi ../rusty-x-ansi
      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@94f54106ddd448427843411da73d6b8a35ae69b3
      - name: Generate code coverage
        run: |
          set -o pipefail
          # PTY-driven example tests are exercised by the gate above but are
          # not deterministic under instrumentation. Measure the library only
          # so coverage does not execute the interactive test target.
          cargo tarpaulin --all-features --lib --out xml --output-dir target/tarpaulin -- --test-threads=1 2>&1 | tee /tmp/tarpaulin.log

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-report
          path: target/tarpaulin/cobertura.xml
          if-no-files-found: error
          retention-days: 1
  coverage-badge:
    name: Update coverage badge
    runs-on: ubuntu-latest
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: dev
          persist-credentials: false
      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coverage-report
          path: target/tarpaulin
      - name: Write coverage badge in place
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          raw="$(grep -oE 'line-rate="[0-9.]+' target/tarpaulin/cobertura.xml | head -1 | grep -oE '[0-9.]+')"
          pct="$(awk -v r="$raw" 'BEGIN { printf "%.1f", r * 100 }')"
          if [ -z "$pct" ]; then
            echo "could not parse coverage from the tarpaulin report" >&2
            exit 1
          fi
          case "$pct" in
            9[0-9]*|100*) color="brightgreen" ;;
            7[5-9]*) color="yellowgreen" ;;
            6[0-9]*) color="orange" ;;
            *) color="red" ;;
          esac
          curl -sS "https://img.shields.io/badge/coverage-${pct}%25-${color}.svg" -o coverage.svg
          content="$(base64 -w 0 coverage.svg)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/coverage.svg?ref=dev" --jq .sha 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/coverage.svg" \
              --field message="docs: update coverage badge ($pct%)" \
              --field content="$content" \
              --field branch=dev \
              --field sha="$existing_sha"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/coverage.svg" \
              --field message="docs: update coverage badge ($pct%)" \
              --field content="$content" \
              --field branch=dev
          fi
