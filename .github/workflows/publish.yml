name: Publish to Crates.io

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish Crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Fetch upstream Go source (pinned)
        run: |
          git clone --quiet https://github.com/charmbracelet/ultraviolet.git upstream-go
          cd upstream-go && git checkout --quiet 1948445e3318
      - name: Fetch sibling charming-x-ansi (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/charming-x-ansi
          path: siblings/charming-x-ansi
          ref: dev
      - name: Place sibling crate
        run: mv siblings/charming-x-ansi ../charming-x-ansi
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --all-targets
      - name: Docgen
        run: cargo doc --no-deps
      - name: Test (all targets, all integration tests)
        run: cargo test --all-targets
      - name: Example E2E sweep (upstream Go vs Rust)
        run: ./scripts/e2e_examples.sh
      - name: Byte-for-byte example parity sweep
        run: ./scripts/verify_examples.sh
      - name: Verify example parity (upstream Go vs Rust)
        run: ./scripts/verify_examples.sh
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
      # Every merge to the live branch publishes to crates.io. crates.io
      # rejects re-publishing an existing version, so the version-bump gate
      # in ci.yml must pass for any merge to land (every merge carries a new
      # tagged version).
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --token ${CARGO_REGISTRY_TOKEN}
