[package]
name = "rusty-ultraviolet"
exclude = ["POLICIES.md"]
version = "0.0.0-20260703014108-f5a850f9c2b7"
edition = "2021"
rust-version = "1.98.0"
description = "Cleanroom Rust port of Charmbracelet's Ultraviolet (pin v0.0.0-20260703014108-f5a850f9c2b7) terminal rendering library"
license = "MIT"

[dependencies]
rusty-colorprofile = "0.4.3"
rusty-x-ansi = "0.11.7"
unicode-segmentation = "1.10.1"
unicode-width = "0.1"
libc = "0.2"

[dev-dependencies]
rusty-testkit = { version = "0.1.1", path = "../rusty-testkit" }
rusty-lipgloss = { version = "2.0.5", path = "../rusty-lipgloss" }

[lib]
name = "rusty_ultraviolet"
path = "src/lib.rs"
